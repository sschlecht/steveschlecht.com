# Pages CMS configuration: https://pagescms.org/docs/
media:
  input: public/images
  output: /images

content:
  - name: blog
    label: Blog posts
    type: collection
    path: src/content/blog
    view:
      fields: [title, date, draft]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description (shown in Google results and post lists, about 150 characters)
        type: text
      - name: date
        label: Publish date
        type: date
        required: true
      - name: draft
        label: Draft (hide from the site)
        type: boolean
        default: false
      - name: body
        label: Post
        type: rich-text

  - name: home
    label: Home page intro
    type: file
    path: src/content/pages/home.md
    fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Description (for Google)
        type: text
      - name: body
        label: Intro
        type: rich-text

  - name: about
    label: About page
    type: file
    path: src/content/pages/about.md
    fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Description (for Google)
        type: text
      - name: body
        label: Content
        type: rich-text
